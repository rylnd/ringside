version: 2.1
jobs:
  build:
    docker:
      - image: cimg/node:24.21
    working_directory: ~/repo

    steps:
      - checkout

      - restore_cache:
          keys:
          - v1-npm-{{ checksum "package-lock.json" }}
          - v1-npm-

      - run: npm ci

      - save_cache:
          paths:
            - ~/.npm
          key: v1-npm-{{ checksum "package-lock.json" }}

      - run: npm run coverage -- --verbose

workflows:
  test:
    jobs:
      - build
